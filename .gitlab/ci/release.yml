# =============================================================================
# 分支二：构建 + 部署
# -----------------------------------------------------------------------------
# - build：push 与手动（web/api）都会执行。push 时纯做生产构建验证（不 bump
#   版本、不提交、不打 tag），保证每次推送都能提前暴露编译打包问题；
#   手动触发（web / api source）时才走完整发版：bump 版本 -> 处理 CHANGELOG ->
#   构建 -> 提交 + 推送 + 打 tag（供 deploy 阶段取版本号）。
# - deploy：仅手动触发（web / api source）时执行，对应"只有需要发布时才部署"。
# =============================================================================

# 阶段 3：构建（push = 构建验证；手动 = 自增版本号 -> 处理 CHANGELOG -> 构建
#         -> 提交 + 推送 + 打 tag）
build:
  extends: .base_env
  stage: build
  tags:
    - yx
  # 慢速 yx 宿主机上 pnpm 依赖 + 全量构建可能很慢，显式放宽（默认 1h 会超时）
  timeout: 2 hours
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: always
    - when: never
  script:
    # 1. 仅手动发布时自增版本号（最末位 +1，每逢 100 进 1），写入根 package.json；
    #    push 触发的构建验证不改动版本号，避免每次推送都发版
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "web" ] || [ "${CI_PIPELINE_SOURCE}" = "api" ]; then
        node scripts/ci-bump-version.js
      fi
    - export APP_VERSION=$(node -p "require('./package.json').version")
    - 'echo "构建版本: v${APP_VERSION}"'

    # 2. 仅手动发布时处理 CHANGELOG（Unreleased 段落归入新版本号 + 日期标题）
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "web" ] || [ "${CI_PIPELINE_SOURCE}" = "api" ]; then
        node scripts/ci-changelog.js "${APP_VERSION}"
      fi

    # 3. 构建全部包（pnpm build = update-version.js + nx run-many -t=build；
    #    update-version.js 会把新版本写入 apps/web/public/version.json）
    - pnpm build

    # 4. 仅手动发布时提交版本变更 + CHANGELOG 变更并推送（提交带 [ci skip]，
    #    防止触发新流水线），并打 release tag；push 验证不做这些副作用
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "web" ] || [ "${CI_PIPELINE_SOURCE}" = "api" ]; then
        git config user.email "gitlab-ci@opentu.local"
        git config user.name "GitLab CI"
        git add package.json apps/web/public/version.json apps/web/index.html CHANGELOG.md
        if git diff --cached --quiet; then
          echo "无版本变更需提交"
        else
          git commit -m "chore(release): bump version to ${APP_VERSION} [ci skip]"
        fi
        if [ -n "${GIT_PUSH_TOKEN}" ]; then
          AUTH_USER="${GIT_PUSH_USER:-gitlab-ci-token}"
          AUTH_PASS="${GIT_PUSH_TOKEN}"
        else
          AUTH_USER="gitlab-ci-token"
          AUTH_PASS="${CI_JOB_TOKEN}"
        fi
        echo "推送用户: ${AUTH_USER}"
        # 实例 external_url 未携带端口（CI_SERVER_HOST/URL 均无 :509），推送地址需显式
        # 带上实例端口；默认 509，可用 CI_PUSH_HOST_PORT 变量覆盖（host 已含端口则跳过）。
        case "${CI_SERVER_HOST}" in
          *:*) PUSH_HOST="${CI_SERVER_HOST}" ;;
          *) PUSH_HOST="${CI_SERVER_HOST}:${CI_PUSH_HOST_PORT:-509}" ;;
        esac
        git push "https://${AUTH_USER}:${AUTH_PASS}@${PUSH_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
        git tag -a "v${APP_VERSION}" -m "release v${APP_VERSION}"
        git push "https://${AUTH_USER}:${AUTH_PASS}@${PUSH_HOST}/${CI_PROJECT_PATH}.git" "v${APP_VERSION}"
      fi

    # 5. 把版本号传给 deploy 阶段（push 触发的 BUILD 也会生成，deploy 不执行无影响）
    - echo "APP_VERSION=${APP_VERSION}" >> build.env
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: build.env

# 阶段 4：部署（docker build + docker compose，跑在 tag=yx 的 runner 上）
#
# 前置要求：yx runner 必须是 shell executor，且宿主机已安装：
#   - docker（含 buildx）
#   - docker compose v2 插件
# runner 上不需要任何 node/pnpm 环境（deploy 只是构建镜像并启动容器）。
deploy:
  stage: deploy
  tags:
    - yx
  needs:
    - build
  # docker build 在慢速宿主上（含 pnpm install + 全量构建）可能超过默认 1h 超时
  timeout: 2 hours
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: always
    - when: never
  script:
    # APP_VERSION 来自 build 阶段 artifacts 的 dotenv 报告（GitLab 自动注入）
    - 'echo "部署版本: v${APP_VERSION:-unknown}"'
    # build 阶段已把「自增版本」提交+推送；同步到该提交，确保 docker build
    # 内部执行 pnpm build 时 package.json / version.json 携带的是新版本号
    - git fetch origin "${CI_COMMIT_BRANCH}"
    - git checkout -f "origin/${CI_COMMIT_BRANCH}"
    # 拉取部署目录中的编排文件（compose 与 Dockerfile 均在仓库内）
    - docker build -t "${IMAGE_NAME}:${APP_VERSION}" -t "${IMAGE_NAME}:latest" .
    # 释放 8088 端口：删除同名容器 + 所有发布到该端口的容器（含手动启动的
    # 实例），再 down 掉 compose 网络，否则 `up --force-recreate` 会报
    # "Bind for 0.0.0.0:8088 failed: port is already allocated"
    - docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
    - |
      for cid in $(docker ps -q --filter "publish=${HOST_PORT}" 2>/dev/null); do
        docker rm -f "${cid}" 2>/dev/null || true
      done
    - docker compose -f deploy/docker-compose.yml down --remove-orphans || true
    - docker compose -f deploy/docker-compose.yml up -d --force-recreate

    # ---------- Feedbackland 一并部署（自托管反馈平台） ----------
    # 认证已改造为 Supabase Auth；NEXT_PUBLIC_* 为构建期内联变量。
    # 运行期变量（DATABASE_URL / SERVICE_ROLE_KEY 等）经 compose 插值注入，
    # 值来自 GitLab CI/CD 变量（FL_* 前缀）。未配置 FL_* 时构建会失败，
    # 这是有意的——部署 Feedbackland 必须先配好这些变量。
    - 'echo "部署 Feedbackland（自托管反馈平台）..."'
    - |
      docker build -f feedbackland/Dockerfile \
        --build-arg NEXT_PUBLIC_SUPABASE_URL="${FL_SUPABASE_URL}" \
        --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${FL_SUPABASE_ANON_KEY}" \
        --build-arg NEXT_PUBLIC_SELF_HOSTED=true \
        -t feedbackland:latest feedbackland/
    # 释放 8090 端口：删除同名容器 + 所有发布到该端口的容器
    - docker rm -f feedbackland 2>/dev/null || true
    - |
      for cid in $(docker ps -q --filter "publish=8090" 2>/dev/null); do
        docker rm -f "${cid}" 2>/dev/null || true
      done
    - docker compose -f deploy/feedbackland/docker-compose.yml down --remove-orphans || true
    - docker compose -f deploy/feedbackland/docker-compose.yml up -d --force-recreate
    - echo "Feedbackland 部署完成：容器 feedbackland @ 宿主机 :8090"

    - docker image prune -f --filter "until=24h" || true
    - echo "部署完成：容器 ${CONTAINER_NAME} @ 宿主机 :${HOST_PORT}（version ${APP_VERSION}）"