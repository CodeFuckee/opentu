# =============================================================================
# Feedbackland 运维作业（手动触发）
# -----------------------------------------------------------------------------
# feedbackland:redeploy：在 yx runner（服务器本机）上重建并拉起 Feedbackland
# 容器（8090），用于容器意外停止后的快速恢复，或发布流水线之外单独更新
# Feedbackland。
#
# 与其它实例的隔离（与 release.yml deploy 作业的 Feedbackland 段落完全同参）：
# - 仅操作容器 feedbackland / 端口 publish=8090 / compose 项目 feedbackland
#   （deploy/feedbackland/ 子目录），绝不触碰生产主站（yue-huabu, 8088）、
#   预览环境（yue-huabu-preview, 8090 之外端口 8089——注意 8089 归预览，
#   本作业端口过滤只针对 8090）
# - 运行期变量（DATABASE_URL 等）与发布流水线一致，来自 GitLab CI/CD 变量
#   （FL_* 前缀）
# =============================================================================

feedbackland:redeploy:
  stage: deploy
  tags:
    - yx
  timeout: 2 hours
  environment:
    name: feedbackland
    url: http://10.37.80.25:8090
  rules:
    # 仅 main 分支的 push 流水线提供手动运维入口；
    # 流水线 B（web/api 手动发版）不出现本作业，发布流程照旧全量部署 Feedbackland
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    # ---------- 诊断：容器现状 + 最近日志（便于追溯停止原因） ----------
    - docker ps -a --filter "name=^feedbackland$" --format "{{.Names}} | {{.Status}} | {{.Image}}" || true
    - docker logs --tail 80 feedbackland 2>&1 | tail -80 || true

    # ---------- 补齐 service_role key（登录验签依赖） ----------
    # CI 变量 FL_SUPABASE_SERVICE_ROLE_KEY 未配置时，从本机（yx runner 与
    # Supabase 栈同宿主机）的 Supabase 栈容器环境变量读取，值不打印、不出服务器；
    # 找不到则明确告警（登录验签将不可用，但站点仍可启动）
    - |
      if [ -z "${FL_SUPABASE_SERVICE_ROLE_KEY}" ]; then
        for c in $(docker ps --format "{{.Names}}" | grep -iE "supabase|kong" || true); do
          v=$(docker exec "$c" printenv SUPABASE_SERVICE_ROLE_KEY 2>/dev/null || true)
          if [ -n "${v}" ]; then
            FL_SUPABASE_SERVICE_ROLE_KEY="${v}"
            export FL_SUPABASE_SERVICE_ROLE_KEY
            echo "已从容器 ${c} 读取 SUPABASE_SERVICE_ROLE_KEY ✓（值不打印）"
            break
          fi
        done
      fi
      if [ -z "${FL_SUPABASE_SERVICE_ROLE_KEY}" ]; then
        echo "⚠ 未获取到 SUPABASE_SERVICE_ROLE_KEY：登录验签不可用；请在 CI/CD Variables 配置 FL_SUPABASE_SERVICE_ROLE_KEY"
      fi

    # ---------- 重建镜像（与 release deploy 同参） ----------
    - docker build -f feedbackland/Dockerfile --build-arg NEXT_PUBLIC_SUPABASE_URL="${FL_SUPABASE_URL}" --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${FL_SUPABASE_ANON_KEY}" --build-arg NEXT_PUBLIC_SELF_HOSTED=true -t feedbackland:latest feedbackland/

    # ---------- 数据库直连（绕过多租户 pooler 的租户标识要求） ----------
    # 5432 网关是租户模式的 Supavisor（直连报 ENOIDENTIFIER），改用容器直连
    # supabase-db：口令从 db 容器环境变量读取（不打印）。设置 FL_SKIP_DB_DIRECT=1
    # 可跳过本逻辑（此时需自行保证 FL_DATABASE_URL 可用）
    - |
      if [ "${FL_SKIP_DB_DIRECT:-0}" != "1" ]; then
        DB_CONTAINER=""
        for c in supabase-db supabase_db db; do
          if docker inspect "$c" >/dev/null 2>&1; then DB_CONTAINER="$c"; break; fi
        done
        if [ -n "${DB_CONTAINER}" ]; then
          DB_PWD=$(docker exec "${DB_CONTAINER}" printenv POSTGRES_PASSWORD 2>/dev/null || true)
          if [ -n "${DB_PWD}" ]; then
            FL_DATABASE_URL="postgres://postgres:${DB_PWD}@${DB_CONTAINER}:5432/feedbackland"
            export FL_DATABASE_URL
            echo "DATABASE_URL 已指向 ${DB_CONTAINER}:5432 直连 ✓（口令不打印）"
          else
            echo "⚠ 未能从 ${DB_CONTAINER} 读取 POSTGRES_PASSWORD，沿用 FL_DATABASE_URL"
          fi
        else
          echo "⚠ 未找到 supabase-db 容器，沿用 FL_DATABASE_URL"
        fi
      fi

    # ---------- 释放 8090 端口：仅同名容器 + publish=8090 的容器 ----------
    - docker rm -f feedbackland 2>/dev/null || true
    - |
      for cid in $(docker ps -q --filter "publish=8090" 2>/dev/null); do
        docker rm -f "${cid}" 2>/dev/null || true
      done
    - docker compose -f deploy/feedbackland/docker-compose.yml down --remove-orphans || true
    - docker compose -f deploy/feedbackland/docker-compose.yml up -d --force-recreate

    # 直连模式：把 feedbackland 挂到 supabase-db 所在网络并重启使其生效
    - |
      if [ "${FL_SKIP_DB_DIRECT:-0}" != "1" ] && docker inspect supabase-db >/dev/null 2>&1; then
        NET=$(docker inspect supabase-db --format '{{range $k,$_ := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
        if [ -n "${NET}" ]; then
          docker network connect "${NET}" feedbackland 2>/dev/null || true
          docker restart feedbackland >/dev/null 2>&1 || true
          echo "已接入网络 ${NET}（直连 supabase-db）并重启容器"
        fi
      fi
    # 数据库网络连通性断言（直连模式）
    - |
      if [ "${FL_SKIP_DB_DIRECT:-0}" != "1" ] && docker inspect supabase-db >/dev/null 2>&1; then
        docker exec feedbackland nc -z -w 2 supabase-db 5432 && echo "supabase-db:5432 可达 ✓"
      fi

    # ---------- 健康检查：容器运行中 + 站点可访问（重试最多 ~40s） ----------
    # 探测 /login：应用没有 "/" 根路由（404），/login 是稳定返回 200 的真实页面
    - docker ps --filter "name=^feedbackland$" --filter "status=running" --format "{{.Names}} -> {{.Ports}}"
    - |
      ok=""
      for i in 1 2 3 4 5 6 7 8; do
        if docker exec feedbackland wget -q -O /dev/null http://127.0.0.1:3000/login 2>/dev/null; then
          ok=1
          break
        fi
        echo "等待 Feedbackland 就绪（第 ${i} 次）..."
        sleep 5
      done
      if [ -z "${ok}" ]; then
        echo "Feedbackland 健康检查未通过，最近日志："
        docker logs --tail 40 feedbackland 2>&1 | tail -40
        exit 1
      fi
      echo "Feedbackland 可访问 ✓"
    - 'echo "Feedbackland 重新部署完成：http://10.37.80.25:8090"'
