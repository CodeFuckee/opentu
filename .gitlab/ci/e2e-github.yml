# =============================================================================
# E2E 桥接 GitHub Actions（试点）
# -----------------------------------------------------------------------------
# 原理与 work-review 项目的 macos-bridge 相同（同一个桥接仓库
# CodeFuckee/gl-macos-bridge）：本作业跑在 linux-x64 shell runner 上，
# 把 ci/e2e-github.sh（base64+上下文）POST 给桥接仓库的 repository_dispatch，
# GitHub 侧按 kind=linux 路由到 ubuntu-latest 一次性 VM 执行：
#   临时 Supabase（官方 compose 钉版，随作业销毁）→ 仓库迁移+种子 →
#   测试账号池引导 → nx build web + vite preview → Playwright。
# 不依赖 LAN Supabase（10.0.0.220:8021）与 yue-e2e 宿主机，runner 在公网。
# 门禁：桥接作业轮询 GitHub run 终态并镜像为退出码（原 test:e2e 同语义）。
# 产物：dist/（playwright-report + test-results 瘦身后）→ package registry
#       → 桥接作业拉回还原为本作业 artifacts。
# 试点阶段手动触发（allow_failure）；验证稳定后可切为主力并退役 yue-e2e 作业。
# =============================================================================

.github-bridge:
  stage: test
  tags: ["linux-x64"]
  script:
    - bash ci/bridge.sh
    # 不做 registry-roundtrip：百 MB 级 dist 经网关回拉在当前链路上结构不稳定
    # （超时/SIGPIPE，多次实测），且 e2e 红绿判定只依赖 GitHub run 结论（bridge.sh
    # 已镜像）。诊断包留在 GitHub 侧 package registry，需要时手动经 GitLab API 取回。
  # 作业级 timeout：须大于 GitHub 侧 timeout-minutes(175m) + 轮询余量
  timeout: 3h
  # 流水线级 pnpm cache 是 runner 持久缓存，桥接作业拉/推纯浪费，禁用
  cache: []
  variables:
    GH_BRIDGE_REPO: "CodeFuckee/gl-macos-bridge"
    GH_POLL_TIMEOUT_MIN: "170"

test:e2e-github:
  extends: .github-bridge
  variables:
    BRIDGE_KIND: "linux"
    MACOS_SCRIPT: "ci/e2e-github.sh"
    MACOS_ENV_PASSTHROUGH: "PNPM_VERSION"
    # 不回拉产物：大文件经网关回传/取回均不稳定（多次实测），作业红绿只镜像
    # GitHub 侧 E2E 判定；诊断包留存在 package registry（linux-bridge 包）可手动取
    MACOS_FETCH_ARTIFACTS: "false"
    GH_POLL_TIMEOUT_MIN: "170"
  rules:
    # masked+protected 变量缺失/为空（未保护分支）→ 跳过
    - if: '$GH_BRIDGE_TOKEN == null || $GH_BRIDGE_TOKEN == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
      allow_failure: true
