# =============================================================================
# 分支一：代码质量检查 + 全量测试
# -----------------------------------------------------------------------------
# 在两个流水线中都会运行：
#   - 流水线 A（push 触发）：只跑本文件的 job（quality + 全量测试）
#   - 流水线 B（手动触发）：先跑本文件，再执行 .gitlab/ci/release.yml
# =============================================================================

# 阶段 1：代码质量检查（typecheck + ESLint）
quality:
  extends: .base_env
  stage: quality
  variables:
    # ckd runner 内存有限：typecheck+eslint 并发峰值会触发系统级 OOM killer
    # （进程静默被杀、无错误输出，#3093/#3098/#3099 三连挂）。堆上限 2048
    # 保留，同时 script 侧 nx 串行(--parallel=1,与 test:frontend 同思路)
    NODE_OPTIONS: "--max-old-space-size=2048"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  script:
    # 不用 pnpm check(其内部 nx run-many 并行 3 项目,峰值叠加);
    # typecheck 与 lint 分开且各自串行,峰值 = 单项目单进程
    - pnpm exec nx run-many -t=typecheck --parallel=1
    - pnpm exec nx run-many -t=lint --parallel=1

# 阶段 2：全量测试（三个 job 并行）

# 前端单元测试（Vitest，nx run-many -t=test：drawnix / utils / web 等全部包）
# 4 个 vitest 项目并发（各 maxWorkers 4/2）在 ckd runner 上仍偶发套件尾声进程被杀
# （OOM 类），改为 1 个并行跑，峰值内存再减半（配合各项目 vitest maxWorkers 上限）。
test:frontend:
  extends: .base_env
  stage: test
  variables:
    # 每个 vitest worker 堆上限 1.5GB，避免 ckd runner 上多 worker 峰值内存
    # 触发 OOM（套件尾声偶发进程被杀）
    NODE_OPTIONS: "--max-old-space-size=1536"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  script:
    - pnpm exec nx run-many -t=test --parallel=1
  # 流水线 UI 显示前端覆盖率（从 vitest text-summary 输出提取 Lines 总覆盖率；
  # 不用 ^ 行首锚点——runner 日志前缀/ANSI 颜色码会导致 ^ 永远匹配失败）
  coverage: '/Lines\s*:\s*([\d\.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # 覆盖率报告（HTML 可浏览 + lcov 机器可读），口径为 drawnix src/engine
      - coverage/packages/drawnix/

# supabase 边缘函数单元测试（node:test；Node ≥23.6 原生支持 .ts 类型剥离）
# --experimental-test-coverage：作业日志末尾输出按文件的行/分支/函数覆盖率汇总
test:backend:
  image: node:24
  tags:
    - ckd-runner
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  before_script:
    - export NPM_TOKEN="${NPM_TOKEN:-}"
  script:
    - node --test --experimental-test-coverage supabase/functions/*/core.test.ts
  coverage: '/^#\s+all files\s*\|\s*([\d\.]+)/'

# segment-server（智能抠图 Python 推理服务）单元测试：
# FastAPI TestClient + FakeEngine（引擎可注入，不需要 torch/GPU）；
# 运行时真实引擎的验证走部署脚本健康检查 + LAN 过目，不进 CI。
# ckd-runner 是 shell 执行器（image 不生效，实际跑在宿主机 Debian 系统
# Python 3.12 上，受 PEP 668 externally-managed 约束，直接 pip install
# 会报错退出）——依赖装进 job 工作区内的 venv，pytest 也用 venv 解释器。
test:segment-server:
  tags:
    - ckd-runner
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  before_script:
    - python3 -m venv services/segment-server/.venv
    - services/segment-server/.venv/bin/pip install --quiet --disable-pip-version-check
      --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      fastapi uvicorn httpx pillow numpy pytest
  script:
    - cd services/segment-server
    - .venv/bin/python -m pytest tests/ -q

# E2E 测试（Playwright，Playwright 官方镜像自带全部浏览器与系统依赖）
# 需要访问内网 Supabase（10.0.0.220:8021，2026-10 宿主机迁移自 10.37.80.25）。
# yue-e2e 是 runner 22（越秀服务器，
# shell executor，忽略 image）独有的标签，该 job 被钉死在这台机器上执行，
# Playwright 系统依赖只需在这台宿主上装一次，换 runner 不会缺依赖。
#
# ⚠️ 宿主机（越秀服务器）一次性 sudo 安装（版本须与 lockfile 一致 1.57.0）：
#   cd <任一 job 检出目录，如 /home/mdc/gitlab-runner/zzvlpMvxf/0/chenkaidi/opentu>
#   export NPM_TOKEN=
#   corepack enable && corepack prepare pnpm@10.21.0 --activate
#   pnpm install --frozen-lockfile
#   export PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
#   sudo -E pnpm exec playwright install --with-deps chromium firefox webkit
#   sudo chmod -R a+rX /opt/ms-playwright
# 浏览器装在共享路径 /opt/ms-playwright（CI 通过 PLAYWRIGHT_BROWSERS_PATH 只读），
# CI 内不含任何需要 root 权限的命令。
#
# E2E 跑「编译打包模式」：E2E_WEB_SERVER=preview 会让 playwright.config.ts 先
# nx build web 再用 vite preview 提供生产构建产物（而非 dev server），从而拦截
# 只在打包后才会暴露的问题（manualChunks 环、tool-windows 初始化崩溃等）。
# vite preview 的 CSP 已移除 upgrade-insecure-requests，避免内网 HTTP Supabase
# 请求被浏览器强制升级为 https 导致 auth-setup 登录 ERR_SSL。
test:e2e:
  image: mcr.microsoft.com/playwright:v1.57.0-noble
  tags:
    - supabase
    - linux-x64
    - yue-e2e
  stage: test
  variables:
    # push 流水线默认跑精简集（smoke + functional），保证在 2 小时 job 超时内完成；
    # 全量 E2E（visual + features 三浏览器 + manual 等）耗时 2.5h+，不适合每次 push，
    # 需要时通过环境变量覆写，例如：
    #   E2E_ARGS: ""                      # 全量
    #   E2E_ARGS: "--project=smoke --project=functional --project=visual"
    E2E_ARGS: "--project=smoke --project=functional"
    # 编译打包模式：webServer 先构建再 vite preview 跑生产产物
    E2E_WEB_SERVER: "preview"
    E2E_SUPABASE_URL: ""
    E2E_SUPABASE_ANON_KEY: ""
    E2E_TEST_PASSWORD: ""
    E2E_CUSTOM_ACCOUNT: ""
    E2E_CUSTOM_PASSWORD: ""
    # 共享浏览器路径不再硬编码到 variables：见 before_script 的「浏览器自愈」，
    # 避免标签重叠的其它 runner（如 2026-09-16 新注册的 runner 24）无此路径时
    # 强行指向 /opt/ms-playwright 导致 "Executable doesn't exist"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  timeout: 2 hours
  before_script:
    - export NPM_TOKEN="${NPM_TOKEN:-}"
    - |
      # 释放可能残留的 dev server：被取消/超时的旧 e2e job 可能遗留
      # `nx serve web` 占用 7200，导致本 job 报
      # "http://localhost:7200 is already used"
      for pid in $(ss -ltnp 2>/dev/null | sed -n 's/.*:7200 .*pid=\([0-9]*\).*/\1/p' | sort -u); do
        kill -9 "${pid}" 2>/dev/null || true
      done
      sleep 1
    - mkdir -p "$HOME/.local/bin"
    - corepack enable --install-directory "$HOME/.local/bin" || corepack enable
    - export PATH="$HOME/.local/bin:$PATH"
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - |
      # 浏览器自愈 v2：精确校验「lockfile 对应的浏览器 build」在共享路径是否齐全。
      # playwright install --dry-run 按当前 playwright 版本列出每个组件的
      # Install location；全部存在才用共享路径，缺任何一个都回退本地安装——
      # 防止两类事故：① 标签重叠的其它 runner（如 2026-09-16 的 runner 24）
      # 根本没有共享路径；② 升级 playwright 后宿主共享浏览器版本滞留。
      export PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
      MISSING=0
      LOC_LIST=$(pnpm exec playwright install chromium --dry-run 2>/dev/null | grep "Install location:" | awk '{print $3}')
      for loc in $LOC_LIST; do
        if [ ! -e "$loc" ]; then MISSING=1; echo "[e2e] 共享路径缺失 $loc"; fi
      done
      if [ -n "$LOC_LIST" ] && [ "$MISSING" = "0" ]; then
        echo "[e2e] 使用共享浏览器 /opt/ms-playwright（与 lockfile 版本匹配）"
      else
        echo "[e2e] 共享浏览器缺失或版本不匹配 → 回退镜像自带/本地安装"
        unset PLAYWRIGHT_BROWSERS_PATH
        pnpm exec playwright install chromium || true
      fi
  script:
    # 测试账号数据治理（openspec improve-sync-performance）：清理固定账号池
    # （e2e_sync_%）的云端同步数据——失败的 retry 会给账号添数据，同步耗时随
    # 之上涨并突破用例等待窗（雪球）。本 job 运行于 supabase 主机，可直接 psql。
    - |
      # 同步行 + 媒体对象全清理：夹具图片 8MB/张，账号桶里累积后媒体下载
      # （串行）轻松突破用例等待窗。storage 表禁止直删，媒体走 Storage API。
      docker exec supabase-db psql -U supabase_admin -d postgres -c \
        "delete from public.user_sync_data where user_id in (select id from auth.users where email like 'e2e_sync_%@yjk.com');" \
        || echo "[e2e] 同步行清理失败（不阻塞套件）"
      docker exec supabase-db psql -U supabase_admin -d postgres -c \
        "delete from public.user_sync_media where user_id in (select id from auth.users where email like 'e2e_sync_%@yjk.com');" \
        || echo "[e2e] 媒体元数据清理失败（不阻塞套件）"
      E2E_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4MTAyMzUyLCJleHAiOjIxMDM0NjIzNTJ9.nQP_hdmnIbCgVfsxlq6TTuRo_FKVYdrRaIDmKViiEBc"
      E2E_PW="${E2E_TEST_PASSWORD:-E2eTest_2026!}"
      # 媒体对象路径来自 DB（storage 表只读），删除走 Storage API（按账号 JWT）
      docker exec supabase-db psql -U supabase_admin -d postgres -t -A -c \
        "select name from storage.objects where bucket_id='yue-sync' and name like 'e2e_sync_%';" \
        | while read -r obj; do
          [ -z "$obj" ] && continue
          SLOT=$(printf '%s' "$obj" | cut -d/ -f1 | sed 's/e2e_sync_//')
          TOKEN=$(curl -s -X POST "http://localhost:8021/auth/v1/token?grant_type=password" \
            -H "apikey: ${E2E_ANON}" -H "Content-Type: application/json" \
            -d "{\"email\":\"e2e_sync_${SLOT}@yjk.com\",\"password\":\"${E2E_PW}\"}" \
            | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          [ -z "$TOKEN" ] && continue
          curl -s -X DELETE "http://localhost:8021/storage/v1/object/yue-sync/${obj}" \
            -H "apikey: ${E2E_ANON}" -H "Authorization: Bearer ${TOKEN}" > /dev/null
        done
      echo "[e2e] 测试账号同步数据与媒体已清理"
    # 空 E2E_ARGS => 运行 playwright.config.ts 中定义的全部 project（全量 E2E）
    - |
      if [ -n "${E2E_ARGS}" ]; then
        pnpm exec nx e2e web-e2e -- ${E2E_ARGS}
      else
        pnpm exec nx e2e web-e2e
      fi
    # artifacts 瘦身（runner→GitLab 上传链路仅 ~330KB/s，大产物会卡 1h 超时）：
    # 删除视频与 trace 大件，保留 error-context.md/截图（轻量诊断件）
    - |
      find apps/web-e2e/test-results -name "*.webm" -delete 2>/dev/null || true
      find apps/web-e2e/test-results -type d -name "trace" -exec rm -rf {} + 2>/dev/null || true
      du -sh apps/web-e2e/test-results apps/web-e2e/playwright-report 2>/dev/null || true
  # 仅失败时上传：绿跑的上传也会经 home.chenkaidi.top:509（WAF/反代）卡死——
  # 实测固定 1h "Client.Timeout exceeded while awaiting headers" 后重试直至
  # 2h job 超时（2026-10-12/13 连续 7 条流水线死于同一处，Playwright 本身全绿）。
  # 失败现场（error-context/截图/报告）只在 on_failure 上传，调试价值不受损。
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - apps/web-e2e/playwright-report/
      - apps/web-e2e/test-results/