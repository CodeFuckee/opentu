<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在进入 Feedbackland…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    .box { text-align: center; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 3px solid #e5e7eb;
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #666; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>正在进入 Feedbackland…</p>
  </div>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var callbackBase = params.get('to') || '';
      var supabaseUrl = (params.get('su') || '').replace(/\/+$/, '');
      var anonKey = params.get('ak') || '';
      // 组织主页（Feedbackland 自带登录页）——任何免登失败都直接落到这里，
      // 不在本页停留展示错误
      var orgHome = callbackBase.replace(/\/auth\/sso$/, '');

      function fallbackToFeedbackland() {
        window.location.replace(orgHome || callbackBase);
      }

      if (!callbackBase || !supabaseUrl || !anonKey) {
        fallbackToFeedbackland();
        return;
      }
      if (!window.opener || window.opener === window) {
        // 非画布入口直接访问：没有 SSO 握手可言，直接进 Feedbackland
        fallbackToFeedbackland();
        return;
      }

      // 1. 向画布窗口请求最新访问令牌（supabase-js 自动续期，永远拿最新的）
      var responded = false;
      function onMessage(event) {
        if (event.origin !== window.location.origin) return;
        if (event.source !== window.opener) return;
        var data = event.data || {};
        if (data.type !== 'opentu-feedback-sso:token') return;
        responded = true;
        window.removeEventListener('message', onMessage);
        // 未登录：直接进 Feedbackland（其自带登录页接住）
        exchangeToken(data.token);
      }
      window.addEventListener('message', onMessage);
      window.opener.postMessage(
        { type: 'opentu-feedback-sso:request-token' },
        window.location.origin
      );

      // 等待画布应答超时（画布异常/被关闭）：直接进 Feedbackland
      setTimeout(function () {
        if (!responded) {
          fallbackToFeedbackland();
        }
      }, 5000);

      // 2. 用访问令牌换取一次性 magic link token；任何失败都直落 Feedbackland
      function exchangeToken(accessToken) {
        if (!accessToken) {
          fallbackToFeedbackland();
          return;
        }
        fetch(supabaseUrl + '/functions/v1/feedbackland-sso', {
          method: 'POST',
          headers: {
            apikey: anonKey,
            Authorization: 'Bearer ' + accessToken,
            'Content-Type': 'application/json',
          },
        })
          .then(function (response) {
            return response.json().then(function (body) {
              return { ok: response.ok, body: body };
            });
          })
          .then(function (result) {
            if (!result.ok || !result.body || !result.body.token_hash) {
              if (window.console && console.warn) {
                console.warn('[feedback-sso] 免登握手失败，回退普通进入', result);
              }
              fallbackToFeedbackland();
              return;
            }
            // 3. 带一次性 token 跳 Feedbackland 回调页（hash 不进服务器日志）
            window.location.replace(
              callbackBase +
                '#token_hash=' +
                encodeURIComponent(result.body.token_hash)
            );
          })
          .catch(function (err) {
            if (window.console && console.warn) {
              console.warn('[feedback-sso] 免登握手异常，回退普通进入', err);
            }
            fallbackToFeedbackland();
          });
      }
    })();
  </script>
</body>
</html>
