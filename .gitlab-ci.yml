# =============================================================================
# Yue画布 (opentu) — GitLab CI/CD 双流水线
# -----------------------------------------------------------------------------
# 流水线 A（推送即触发）：代码质量检查 + 全量测试 + 构建验证
#   - push 到任意分支时自动运行 quality / test:frontend / test:backend /
#     test:e2e（E2E 走编译打包模式：先 nx build web 再用 vite preview 跑生产
#     产物）以及 build 阶段（对全仓库生产构建做验证，不 bump 版本/不打 tag、
#     不部署），保证每次推送都能提前暴露编译打包问题
#
# 流水线 B（手动触发）：质量检查 + 全量测试 + 发版构建 + 部署
#   - GitLab 页面 → CI/CD → Pipelines → "Run pipeline"（或 API 触发）
#   - 仅 web / api 两种手动来源会创建该流水线
#   - build 在手动来源下自增版本号（最末位 +1，每逢 100 进 1）→ 处理 CHANGELOG
#     （Unreleased 内容归入新版本标题，重置 Unreleased 段落）→ 构建 → 提交+
#     推送+打 tag → 部署。deploy 只在这条手动流水线里执行（只有发布时才部署）
#
# 需要预先在 GitLab CI/CD Variables 中配置（均可选，缺省有安全默认值）：
#   NPM_TOKEN                可选，npm registry 认证（.npmrc 引用 ${NPM_TOKEN}）
#   GIT_PUSH_USER            推送用用户名，默认 gitlab-ci-token（配合 CI_JOB_TOKEN）
#   GIT_PUSH_TOKEN           推送用令牌（Deploy Token / PAT，需 write_repository）
#   E2E_SUPABASE_URL         E2E 目标 Supabase 地址（默认 http://10.0.0.220:8021）
#   E2E_SUPABASE_ANON_KEY    E2E 目标 Supabase anon key（默认取代码内置值）
#   E2E_TEST_PASSWORD        E2E 测试账号统一密码（默认 E2eTest_2026!）
#   E2E_CUSTOM_ACCOUNT/PASSWORD  可选自定义 E2E 账号
#
# Feedbackland 自托管部署（release.yml deploy job 一并部署，deploy 缺失任一必填
# 变量会构建失败——这是有意的）：
#   FL_DATABASE_URL            Feedbackland 独立数据库连接串
#                             （如 postgres://postgres:<密码>@10.37.80.25:5432/feedbackland）
#   FL_SUPABASE_URL            自建 Supabase 网关地址（生产默认 http://10.37.80.25:8021）
#   FL_SUPABASE_ANON_KEY       anon key（公钥，build 期内联）
#   FL_SUPABASE_SERVICE_ROLE_KEY  service_role 密钥（机密，仅容器运行期使用）
#   FL_OPENROUTER_API_KEY      可选，Feedbackland AI 洞察功能
#
# 前置要求：test:e2e 固定运行在带 yue-e2e 唯一标签的 runner（越秀服务器 22 号，
# shell executor，忽略 image），宿主机需一次性 sudo 安装 Playwright 系统依赖与
# 浏览器（具体命令见 .gitlab/ci/quality-test.yml 注释），CI 内不执行任何需要
# root 权限的命令。
#
# 预览环境（preview-deploy.yml）：main 分支 push 流水线中的自动 deploy 作业，
# 测试（quality + 三类 test + build）全部成功后自动部署到宿主机 8089 端口
# （容器 yue-huabu-preview）供小范围内测；后端与生产一致（生产 Supabase）。
# 与生产实例完全隔离——独立镜像名/容器名/compose 项目名，端口清理仅限 8089。
#
# 生产环境手动部署（production-deploy.yml）：main 分支 push 流水线中的手动作业
# deploy:production，测试（quality + 三类 test + build）全部成功后可手动点击，
# 把当前 main 部署到生产（宿主机 8088，容器 yue-huabu）。零发布副作用：
# 不 bump 版本、不改 CHANGELOG、不打 tag（版本号升级仍走流水线 B 正式发版）。
# 仅操作生产容器/8088 端口/生产 compose 项目，与预览（8089）、Feedbackland
# （8090）互不影响。
#
# Feedbackland 运维（ops.yml）：main 分支 push 流水线中的手动作业
# feedbackland:redeploy，在服务器本机重建并拉起 Feedbackland 容器（8090），
# 用于容器意外停止后的快速恢复；仅操作 feedbackland 容器 / 8090 端口，
# 与生产主站（8088）、预览环境（8089）互不影响。
# =============================================================================

workflow:
  rules:
    # 推送（任意分支）→ 流水线 A：quality + 全量测试
    - if: '$CI_PIPELINE_SOURCE == "push"'
    # 手动（页面 Run pipeline / API）→ 流水线 B：完整流程
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - quality
  - test
  - build
  - deploy

variables:
  # git safe.directory：shell runner（gitlab-runner 用户）克隆 /home/ckd/builds 下
  # 属主为 ckd 的仓库会报 dubious ownership（2026-10-19 quality 作业失败根因）。
  # 用 GIT_CONFIG_* 环境变量注入，对 get_sources 阶段的 git fetch 同样生效
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "/home/ckd/builds"
  # 根 package.json 声明的 pnpm 版本；corepack 会自动安装锁定版本
  PNPM_VERSION: "10.21.0"
  # npm registry 认证（未配置时导出为空串，避免 pnpm 因 ${NPM_TOKEN} 未定义报错）
  NPM_TOKEN: ""
  # 部署产物名称（与 deploy/docker-compose.yml 一致）
  IMAGE_NAME: "yue-huabu"
  CONTAINER_NAME: "yue-huabu"
  HOST_PORT: "8088"
  # 预览环境产物名称（与 deploy/preview/docker-compose.yml 一致，
  # 见 .gitlab/ci/preview-deploy.yml；与生产镜像/容器/端口完全隔离）
  PREVIEW_IMAGE_NAME: "yue-huabu-preview"
  PREVIEW_CONTAINER_NAME: "yue-huabu-preview"
  PREVIEW_HOST_PORT: "8089"

# 基础环境模板（供 include 文件通过 extends 复用）：
# Node + corepack + pnpm 安装（带 store 缓存）
# tags 固定到 Linux docker runner（ckd-runner），避免被 Windows shell runner 拾取——
# 该 runner 在 prepare_environment 阶段的 PowerShell 变量注入会因
# CI_COMMIT_AUTHOR 中的 <> 与 CI_RUNNER_TAGS 中的引号/反引号报 ParserError。
.base_env:
  image: node:20
  tags:
    - ckd-runner
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - export NPM_TOKEN="${NPM_TOKEN:-}"
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

include:
  # 质量检查 + 全量测试（流水线 A 与 B 共用）
  - local: '.gitlab/ci/quality-test.yml'
  # 构建 + 部署（仅流水线 B）
  - local: '.gitlab/ci/release.yml'
  # 预览环境手动部署（main 分支 push 流水线的手动作业，8089 端口，与生产隔离）
  - local: '.gitlab/ci/preview-deploy.yml'
  # 生产环境手动部署（main 分支 push 流水线的手动作业，8088 端口，零发布副作用）
  - local: '.gitlab/ci/production-deploy.yml'
  # Feedbackland 运维作业（手动恢复/单独更新 8090 反馈平台，与其它实例隔离）
  - local: '.gitlab/ci/ops.yml'
  # E2E 桥接 GitHub Actions（试点，手动触发；docs 见文件头注释）
  - local: '.gitlab/ci/e2e-github.yml'